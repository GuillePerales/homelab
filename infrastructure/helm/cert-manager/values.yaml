# cert-manager — Helm values
# Chart: jetstack/cert-manager v1.21.3 (fijada; subirla a propósito)
# Namespace: cert-manager
# Docs: https://cert-manager.io/docs/installation/helm/
#
# helm upgrade --install cert-manager jetstack/cert-manager --version v1.21.3 \
#   -n cert-manager --create-namespace -f infrastructure/helm/cert-manager/values.yaml
# Después: kubectl apply -f services/k8s/apps/cert-manager/cluster-issuer.yaml

crds:
  enabled: true
  keep: true # borrar el release no borra los Certificate del clúster

resources:
  requests:
    memory: 64Mi
    cpu: 10m
  limits:
    memory: 128Mi
