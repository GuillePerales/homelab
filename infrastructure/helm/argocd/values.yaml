# ArgoCD — Helm values
# Chart: argo/argo-cd 10.18.0 (ArgoCD v3.6.1; fijada, subirla a propósito)
# Namespace: argocd
# Docs: https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd
#
# helm upgrade --install argocd argo/argo-cd --version 10.18.0 \
#   -n argocd --create-namespace -f infrastructure/helm/argocd/values.yaml
#
# Nodo de 4 GB: sin Dex (login solo local), sin notificaciones y ApplicationSet a 0 réplicas.
# El repositorio de manifiestos y la App of Apps se aplican aparte
# (services/k8s/argocd/), porque llevan la credencial de lectura.

global:
  domain: argocd.k3s.home.arpa
  # Las políticas de red del chart dejan entrar a cualquiera al servidor: mandan las de
  # services/k8s/platform/argocd (solo el mismo namespace y Traefik)
  networkPolicy:
    create: false

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  replicas: 0 # el chart no tiene interruptor: se deja sin pods

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.k3s.home.arpa
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi

controller:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi

repoServer:
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 384Mi

redis:
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 128Mi

configs:
  params:
    # Traefik termina el TLS
    server.insecure: true
