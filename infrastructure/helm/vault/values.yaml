# HashiCorp Vault — Helm values
# Chart: hashicorp/vault 0.34.1 (Vault 2.0.4; fijada, subirla a propósito)
# Namespace: vault
# Docs: https://developer.hashicorp.com/vault/docs/platform/k8s/helm
#
# helm upgrade --install vault hashicorp/vault --version 0.34.1 \
#   -n vault --create-namespace -f infrastructure/helm/vault/values.yaml
#
# Una réplica, almacenamiento en fichero en local-path (nunca en NFS). Vault queda
# sellado tras cada reinicio: ver el procedimiento de unseal del runbook de la fase 4b.

global:
  tlsDisable: true # Traefik termina el TLS; dentro del clúster va en HTTP

server:
  standalone:
    enabled: true
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 384Mi

  dataStorage:
    enabled: true
    storageClass: local-path
    size: 1Gi

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca
    hosts:
      - host: vault.homelab.local
        paths:
          - /
    tls:
      - secretName: vault-tls
        hosts:
          - vault.homelab.local

ui:
  enabled: true

# Vault Agent Injector: inyecta secretos en los pods con anotaciones
injector:
  enabled: true
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 128Mi
