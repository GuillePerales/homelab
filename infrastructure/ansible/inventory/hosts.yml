# Los nombres son alias de ~/.ssh/config en la máquina de control: la IP de conexión, el usuario
# y la clave salen de ahí. Las IPs de los servicios (monitoring_address, contenedores en srv-net)
# sí están en inventory/host_vars: son direcciones privadas y este repo ya publica otras, en
# OpenTofu y ArgoCD. Los secretos nunca: van por entorno desde ficheros locales.
all:
  children:
    proxmox:
      hosts:
        pve-router:
        pve-main:
        pve-aux:
    docker_hosts:          # LXC Debian con Docker (el Docker del NAS lo gestiona TrueNAS)
      hosts:
        docker-main:
        docker-aux:
    k3s_nodes:             # VM de la fase 4b (OpenTofu: k3s-vms.tf)
      hosts:
        k3s-01:
    devops_stack:
      hosts:
        docker-main:
    dozzle_agents:         # hosts Docker que enseñan sus logs al Dozzle de docker-aux (no docker-aux: ahí está el hub)
      hosts:
        docker-main:
    monitoring:            # donde corre Prometheus (fase 8)
      hosts:
        docker-aux:
    firewall:              # OPNsense: solo objetivo de métricas (Ansible no lo gestiona)
      hosts:
        fw-01:
    nas:                   # TrueNAS Scale: appliance, sin apt; solo tareas de lectura
      hosts:
        nas-01:
