# y la clave salen de ahí, para no publicar direcciones internas en el repo.
all:
  children:
    proxmox:
      hosts:
        pve-router:
        pve-main:
        pve-aux:
    docker_hosts:          # LXC Debian con Docker (el Docker del NAS lo gestiona TrueNAS)
      hosts:
        docker-main:
        docker-aux:
    k3s_nodes:             # VM de la fase 4b (OpenTofu: k3s-vms.tf)
      hosts:
        k3s-01:
    devops_stack:
      hosts:
        docker-main:
    monitoring:            # donde corre Prometheus (fase 8)
      hosts:
        docker-aux:
    nas:                   # TrueNAS Scale: appliance, sin apt; solo tareas de lectura
      hosts:
        nas-01:
