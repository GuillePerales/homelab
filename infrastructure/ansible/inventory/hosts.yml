# Los nombres son alias de ~/.ssh/config en la máquina de control: la IP, el usuario
# y la clave salen de ahí, para no publicar direcciones internas en el repo.
all:
  children:
    proxmox:
      hosts:
        pve-router:
        pve-main:
        pve-aux:
    docker_hosts:          # LXC Debian con Docker (el Docker del NAS lo gestiona TrueNAS)
      hosts:
        docker-main:
        docker-aux:
    devops_stack:
      hosts:
        docker-main:
    nas:                   # TrueNAS Scale: appliance, sin apt; solo tareas de lectura
      hosts:
        nas-01:
