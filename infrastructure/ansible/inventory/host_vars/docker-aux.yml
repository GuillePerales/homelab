# infrastructure/ansible/inventory/host_vars/docker-aux.yml
---
pve_node: pve-aux
pve_vmid: 201

nfs_binds: []

# Bloque de docker-aux: .50-.63. ip-range (solo para IPs automáticas) dentro de él
docker_macvlan_ip_range: 10.0.30.56/29

# Agente de Portainer en srv-net (lo registra a mano el server de docker-main)
portainer_agent_ip: 10.0.30.50

# Prometheus (rol prometheus): IP fija en srv-net
prometheus_container_ip: 10.0.30.51

# Shim: el host alcanza a sus contenedores macvlan y ellos a él (Prometheus lee
# el node_exporter de docker-aux por esta IP)
macvlan_shim:
  address: 10.0.30.99/32
  routes:
    - 10.0.30.50/31
    - 10.0.30.52/30
    - 10.0.30.56/29

# IP desde la que Prometheus alcanza el node_exporter de este host (el shim)
monitoring_address: 10.0.30.99

# Alertmanager (rol alertmanager): IP fija en srv-net y webhook de ntfy
alertmanager_container_ip: 10.0.30.52
alertmanager_ntfy_url: "http://10.0.30.31/homelab-alertas?template=alertmanager"
prometheus_alertmanagers: ["{{ alertmanager_container_ip }}:9093"]

# Grafana (rol grafana): IP fija en srv-net
grafana_container_ip: 10.0.30.53
prometheus_grafana_targets: ["{{ grafana_container_ip }}:3000"]

# Blackbox Exporter (rol blackbox): IP fija en srv-net
blackbox_container_ip: 10.0.30.55
prometheus_blackbox_address: "{{ blackbox_container_ip }}:9115"

# Exporter de qBittorrent (rol qbittorrent_exporter): IP fija en srv-net y web de qBittorrent
qbittorrent_exporter_container_ip: 10.0.30.56
qbittorrent_exporter_url: "http://10.0.30.15:8080"
prometheus_qbittorrent_address: "{{ qbittorrent_exporter_container_ip }}:8090"

# Dozzle (rol dozzle): IP fija en srv-net y agentes de los demás hosts Docker (docker-main y el NAS)
dozzle_container_ip: 10.0.30.57
dozzle_remote_agents:
  - 10.0.30.40:7007
  - 10.0.30.45:7007

# Exporter de Proxmox (rol pve_exporter): IP fija en srv-net. Prometheus pregunta a pve-main
pve_exporter_container_ip: 10.0.30.58
prometheus_pve_exporter_address: "{{ pve_exporter_container_ip }}:9221"
prometheus_pve_target: "{{ hostvars['pve-main'].monitoring_address }}"

# Exporter de OPNsense (rol opnsense_exporter): IP fija en srv-net y dirección del firewall
opnsense_exporter_container_ip: 10.0.30.59
opnsense_exporter_address: "{{ hostvars['fw-01'].monitoring_address }}"
prometheus_opnsense_exporter_address: "{{ opnsense_exporter_container_ip }}:8080"

# Exporter de PBS (rol pbs_exporter): IP fija en srv-net y API del contenedor `pbs` del NAS (misma VLAN)
pbs_exporter_container_ip: 10.0.30.60
pbs_exporter_endpoint: https://10.0.30.16:8007
prometheus_pbs_exporter_address: "{{ pbs_exporter_container_ip }}:10019"

# cAdvisor (rol cadvisor): IP fija en srv-net
cadvisor_container_ip: 10.0.30.54

# Escaneo semanal de imágenes (rol trivy_scan): ntfy de docker-main
trivy_scan_ntfy_url: "http://10.0.30.31/"


# Métricas del clúster K3s en Prometheus (jobs k3s, k3s-cadvisor y kube-state-metrics)
prometheus_k3s_address: "{{ hostvars['k3s-01'].monitoring_address }}"
