# infrastructure/ansible/inventory/host_vars/docker-aux.yml
---
pve_node: pve-aux
pve_vmid: 201

nfs_binds: []

# Bloque de docker-aux: .50-.63. ip-range (solo para IPs automáticas) dentro de él
docker_macvlan_ip_range: 10.0.30.56/29

# Agente de Portainer en srv-net (lo registra a mano el server de docker-main)
portainer_agent_ip: 10.0.30.50

# Prometheus (rol prometheus): IP fija en srv-net
prometheus_container_ip: 10.0.30.51

# Shim: el host alcanza a sus contenedores macvlan y ellos a él (Prometheus lee
# el node_exporter de docker-aux por esta IP)
macvlan_shim:
  address: 10.0.30.99/32
  routes:
    - 10.0.30.50/31
    - 10.0.30.52/30

# IP desde la que Prometheus alcanza el node_exporter de este host (el shim)
monitoring_address: 10.0.30.99

# Alertmanager (rol alertmanager): IP fija en srv-net y webhook de ntfy
alertmanager_container_ip: 10.0.30.52
alertmanager_ntfy_url: "http://10.0.30.31/homelab-alertas?template=alertmanager"
prometheus_alertmanagers: ["{{ alertmanager_container_ip }}:9093"]

# Grafana (rol grafana): IP fija en srv-net
grafana_container_ip: 10.0.30.53

# cAdvisor (rol cadvisor): IP fija en srv-net
cadvisor_container_ip: 10.0.30.54
