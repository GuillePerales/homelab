# infrastructure/ansible/playbooks/monitoring.yml
#
# Stack de monitorización (fase 8): exporters en los nodos (node_exporter y smartctl_exporter
# en los Proxmox), cAdvisor en los hosts Docker, Blackbox, el exporter de qBittorrent y Dozzle
# (hub en docker-aux y agentes en los demás hosts Docker), los exporters de Proxmox y de OPNsense
# (por API) y Prometheus, Alertmanager y Grafana, todo en docker-aux.
# nas-01 queda fuera: TrueNAS es un appliance, sin apt ni systemd propio.
#
# Uso:
#   ansible-playbook playbooks/monitoring.yml --check --diff
#   ansible-playbook playbooks/monitoring.yml --tags node_exporter --limit docker-aux
---
- name: Install exporters on every node
  hosts: proxmox:docker_hosts:k3s_nodes
  become: true
  roles:
    - role: node_exporter
      tags: [node_exporter]

- name: Install smartctl_exporter on the Proxmox nodes
  hosts: proxmox
  become: true
  roles:
    - role: smartctl_exporter
      tags: [smartctl_exporter]

- name: Deploy cAdvisor on the Docker hosts
  hosts: docker_hosts
  become: true
  roles:
    - role: cadvisor
      tags: [cadvisor]

- name: Deploy Blackbox Exporter
  hosts: monitoring
  become: true
  roles:
    - role: blackbox
      tags: [blackbox]

- name: Deploy the qBittorrent exporter
  hosts: monitoring
  become: true
  roles:
    - role: qbittorrent_exporter
      tags: [qbittorrent_exporter]

- name: Deploy the Dozzle agents
  hosts: dozzle_agents
  become: true
  roles:
    - role: dozzle_agent
      tags: [dozzle_agent]

- name: Deploy Dozzle
  hosts: monitoring
  become: true
  roles:
    - role: dozzle
      tags: [dozzle]

- name: Deploy the Proxmox exporter
  hosts: monitoring
  become: true
  roles:
    - role: pve_exporter
      tags: [pve_exporter]

- name: Deploy the OPNsense exporter
  hosts: monitoring
  become: true
  roles:
    - role: opnsense_exporter
      tags: [opnsense_exporter]

- name: Deploy Prometheus
  hosts: monitoring
  become: true
  roles:
    - role: prometheus
      tags: [prometheus]

- name: Deploy Alertmanager
  hosts: monitoring
  become: true
  roles:
    - role: alertmanager
      tags: [alertmanager]

- name: Deploy Grafana
  hosts: monitoring
  become: true
  roles:
    - role: grafana
      tags: [grafana]
