# infrastructure/ansible/playbooks/monitoring.yml
#
# Stack de monitorización (fase 8). Exporters en los nodos, cAdvisor en los hosts Docker, Prometheus, Alertmanager y Grafana en docker-aux.
# El resto de exporters y dashboards se añaden después.
# nas-01 queda fuera: TrueNAS es un appliance, sin apt ni systemd propio.
#
# Uso:
#   ansible-playbook playbooks/monitoring.yml --check --diff
#   ansible-playbook playbooks/monitoring.yml --tags node_exporter --limit docker-aux
---
- name: Install exporters on every node
  hosts: proxmox:docker_hosts:k3s_nodes
  become: true
  roles:
    - role: node_exporter
      tags: [node_exporter]

- name: Deploy cAdvisor on the Docker hosts
  hosts: docker_hosts
  become: true
  roles:
    - role: cadvisor
      tags: [cadvisor]

- name: Deploy Prometheus
  hosts: monitoring
  become: true
  roles:
    - role: prometheus
      tags: [prometheus]

- name: Deploy Alertmanager
  hosts: monitoring
  become: true
  roles:
    - role: alertmanager
      tags: [alertmanager]

- name: Deploy Grafana
  hosts: monitoring
  become: true
  roles:
    - role: grafana
      tags: [grafana]
