# infrastructure/ansible/playbooks/proxmox-node-setup.yml
# Proxmox VE 9 (Debian trixie), repos en formato deb822.
# La actualización completa solo corre si se pide: --tags upgrade
---
- name: Configure Proxmox nodes
  hosts: proxmox

  tasks:
    - name: Find enterprise repos
      ansible.builtin.stat:
        path: "/etc/apt/sources.list.d/{{ item }}.sources"
      loop: [pve-enterprise, ceph]
      register: enterprise_repos

    - name: Disable enterprise repos   # algunos nodos no los tienen
      ansible.builtin.lineinfile:
        path: "{{ item.stat.path }}"
        regexp: "^Enabled:"
        line: "Enabled: no"
      loop: "{{ enterprise_repos.results | selectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Add no-subscription repo
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/proxmox.sources
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: trixie
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
        mode: "0644"

    - name: Update and upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: full
      tags: [never, upgrade]

    - name: Install utilities
      ansible.builtin.apt:
        name: [vim, curl, wget, htop, iotop, net-tools]
        state: present

    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Add authorized SSH key
      ansible.posix.authorized_key:
        user: root
        key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/homelab_ed25519.pub') }}"
