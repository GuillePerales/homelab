# Alertas de qBittorrent. Las dos primeras vigilan lo que más cuesta en un tracker privado:
# no ser conectable (casi no se sube) y tener torrents en cola (no comparten: cuentan como
# hit and run). qbit-vigia ya reinicia la VPN si el puerto se pierde; esto avisa si no basta.
groups:
  - name: torrents
    rules:
      - alert: QbittorrentNotConnectable
        expr: qbittorrent_transfer_connection_status{connection_status="connected"} == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "qBittorrent no es conectable"
          description: "qBittorrent lleva 30 minutos firewalled o desconectado: sin puerto reenviado por la VPN los demás no pueden conectar y casi no se sube."

      - alert: QbittorrentTorrentsQueued
        expr: sum(qbittorrent_torrent_states{name="queuedUP"}) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} torrents en cola para subir"
          description: >-
            Hay torrents completos en cola desde hace una hora: no comparten y en un tracker
            privado cuentan como hit and run. Revisa la cola de qBittorrent.

      - alert: QbittorrentExporterDown
        expr: up{job="qbittorrent"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sin métricas de qBittorrent"
          description: "Prometheus no consigue leer el exporter de qBittorrent desde hace 10 minutos (el exporter, la clave de API o qBittorrent)."

      - alert: GluetunReinicioBucle
        expr: increase(gluetun_vpn_restarts_total[1h]) >= 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "La VPN de {{ $labels.container }} se reinicia en bucle"
          description: >-
            {{ $value | printf "%.0f" }} reinicios por fallo de healthcheck en la última hora (lo normal es 0).
            Anoche hubo un bucle de 344 y 60 reinicios en 24 horas. Mira los logs de Gluetun y el túnel
            de OPNsense; qbit-vigia solo actúa si qBittorrent pierde el puerto.

      - alert: QbitVigiaSinMetricas
        expr: >-
          (time() - node_textfile_mtime_seconds{host="nas-01", file=~".*/gluetun.prom"} > 3600)
          or (qbit_vigia_export_ok{host="nas-01"} == 0)
          or (node_textfile_scrape_error{host="nas-01"} == 1)
          or absent(node_textfile_mtime_seconds{host="nas-01", file=~".*/gluetun.prom"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No se actualiza el contador de reinicios de VPN de Gluetun"
          description: >-
            El fichero gluetun.prom del NAS no se escribe desde hace más de una hora, no existe, el
            collector falla o qbit-vigia no pudo leer los logs de algún Gluetun (ver metricas.log en
            los logs de qbit-vigia del NAS).
