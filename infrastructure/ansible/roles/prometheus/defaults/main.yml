---
# Prometheus en docker-aux, desplegado como el resto de stacks: un compose por
# servicio con `docker compose -p prometheus up -d`. La imagen y los volúmenes
# salen del compose del repo (services/docker-compose/monitoring/prometheus).

# IP fija en srv-net (bloque de docker-aux: .50–.63; la .50 es el agente de Portainer)
prometheus_container_ip: ""

# Datos y configuración en el disco local del CT, no en vault/apps (NFS sobre los
# SSD del NAS): Prometheus escribe sin parar y el desgaste de esos SSD ya preocupa.
prometheus_appdata: /srv/prometheus
prometheus_stack_dir: /opt/prometheus

# Hosts con node_exporter que se recogen; cada uno necesita monitoring_address
# en su host_vars (IP desde la que docker-aux llega a su :9100).
prometheus_node_hosts: "{{ groups['proxmox'] + groups['docker_hosts'] + groups['k3s_nodes'] + groups['nas'] + groups['firewall'] }}"
prometheus_node_port: 9100

# Alertmanagers a los que enviar alertas (host:puerto). Vacío hasta que exista el rol.
prometheus_alertmanagers: []

# Hosts Docker con cAdvisor (cadvisor_container_ip en su host_vars)
prometheus_cadvisor_hosts: "{{ groups['docker_hosts'] + groups['nas'] }}"
prometheus_cadvisor_port: 8080

# Hosts con smartctl_exporter: los Proxmox (binario) y nas-01 (contenedor, con su
# IP en smartctl_address del host_vars; sin ella se usa monitoring_address)
prometheus_smartctl_hosts: "{{ groups['proxmox'] + groups['nas'] }}"
prometheus_smartctl_port: 9633

# Grafana (host:puerto) para recoger sus propias métricas en /metrics, que vienen
# activadas de fábrica. El job de Alertmanager sale de prometheus_alertmanagers.
prometheus_grafana_targets: []

# Blackbox Exporter (host:puerto). Los objetivos los escribe el rol blackbox en
# config/targets/blackbox.yml del appdata; vacío desactiva el job.
prometheus_blackbox_address: ""

# Exporter de qBittorrent (host:puerto); vacío desactiva el job. Las etiquetas de tracker
# se reducen a dominio: la URL de announce puede llevar el passkey.
prometheus_qbittorrent_address: ""

# Exporter de Proxmox (host:puerto) y nodo al que preguntar; vacío desactiva el job.
prometheus_pve_exporter_address: ""
prometheus_pve_target: ""

# Exporter de OPNsense (host:puerto); vacío desactiva el job.
prometheus_opnsense_exporter_address: ""

# Exporter de PBS (host:puerto); vacío desactiva el job.
prometheus_pbs_exporter_address: ""
