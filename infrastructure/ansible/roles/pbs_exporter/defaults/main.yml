---
# pbs-exporter en docker-aux, con el compose del repo (`docker compose -p pbs-exporter up -d`).
# Prometheus lo lee por su IP en srv-net, puerto 10019. PBS está en la misma VLAN: no hace falta regla de OPNsense.

# IP fija en srv-net (bloque de docker-aux: .50–.63)
pbs_exporter_container_ip: ""

# Dirección de la API de PBS (https://ip:8007)
pbs_exporter_endpoint: ""

pbs_exporter_stack_dir: /opt/pbs-exporter
pbs_exporter_port: 10019

# Usuario y token de PBS de solo lectura (rol Audit en /, también para el token)
pbs_exporter_user: prometheus@pbs
pbs_exporter_token_name: exporter

# Valor del token. Se pasa por entorno al lanzar el playbook (PBS_EXPORTER_TOKEN, leído de un fichero
# local fuera del repo). Si no viene y ya hay un .env en el host, se conserva el que tiene.
pbs_exporter_token: "{{ lookup('ansible.builtin.env', 'PBS_EXPORTER_TOKEN') }}"
