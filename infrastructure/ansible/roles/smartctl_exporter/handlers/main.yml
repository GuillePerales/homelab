---
# Primero udev, para que los permisos del NVMe estén antes de reiniciar el exporter
- name: Apply udev rules
  ansible.builtin.shell: udevadm control --reload && udevadm trigger --subsystem-match=nvme --action=change && udevadm settle
  changed_when: true

- name: Restart smartctl_exporter
  ansible.builtin.systemd_service:
    name: smartctl_exporter
    state: restarted
    daemon_reload: true
