---
# Versión fijada y checksum de sha256sums.txt de la release de GitHub.
# Actualizar: cambiar las dos y relanzar; la versión anterior se queda en disco
# para volver atrás cambiando solo el enlace.
smartctl_exporter_version: "0.15.0"
smartctl_exporter_sha256: "32ff269f2ca5708e2aa8209c715192efcc32f87bd575cae50a76d391a484976e"

smartctl_exporter_release_url: https://github.com/prometheus-community/smartctl_exporter/releases/download
smartctl_exporter_user: smartctl_exporter
smartctl_exporter_install_dir: /opt/smartctl_exporter
smartctl_exporter_bin: /usr/local/bin/smartctl_exporter
smartctl_exporter_smartctl: /usr/sbin/smartctl

# Todas las interfaces: quién llega al 9633 lo decide el firewall, no el exporter.
smartctl_exporter_listen: ":9633"

# Cada cuánto lee el SMART. Solo lectura: el exporter no lanza tests.
smartctl_exporter_interval: 300s

# standby: si el disco está dormido, no lo despierta para leerlo
smartctl_exporter_powermode_check: standby

# El NVMe: su dispositivo /dev/nvmeN es root:root 0600 y no está en el grupo disk, así que el
# exporter, que sí está en disk, no lo abre. En vez de darle CAP_DAC_READ_SEARCH (leer cualquier
# fichero del host), una regla de udev pone esos dispositivos en el grupo disk con 0660, como ya
# están los discos SATA. Se aplica en cada arranque y no abre nada a otros usuarios.
smartctl_exporter_nvme_udev: true
smartctl_exporter_udev_rule: /etc/udev/rules.d/60-smartctl-exporter-nvme.rules

# Capacidades del servicio: SYS_RAWIO y SYS_ADMIN para las consultas SMART a los discos.
smartctl_exporter_capabilities:
  - CAP_SYS_RAWIO
  - CAP_SYS_ADMIN
