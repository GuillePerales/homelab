---
# opnsense-exporter en docker-aux, con el compose del repo (`docker compose -p opnsense-exporter up -d`).
# Prometheus lo lee por su IP en srv-net, puerto 8080.

# IP fija en srv-net (bloque de docker-aux: .50–.63)
opnsense_exporter_container_ip: ""

# Dirección de OPNsense (la IP de gestión) y nombre con el que sale en las métricas
opnsense_exporter_address: ""
opnsense_exporter_instance_label: fw-01

opnsense_exporter_stack_dir: /opt/opnsense-exporter
opnsense_exporter_port: 8080

# Clave y secreto de API del usuario de solo lectura de OPNsense. Se pasan por entorno al lanzar el
# playbook (OPNSENSE_API_KEY y OPNSENSE_API_SECRET, leídos de un fichero local fuera del repo). Si no
# vienen y ya hay un .env en el host, se conservan.
opnsense_exporter_api_key: "{{ lookup('ansible.builtin.env', 'OPNSENSE_API_KEY') }}"
opnsense_exporter_api_secret: "{{ lookup('ansible.builtin.env', 'OPNSENSE_API_SECRET') }}"
