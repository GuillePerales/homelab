# Imagen de práctica de la fase 4: build -> Trivy -> registro de Forgejo.
# Se construye UNA vez en un tar; lo que se escanea es exactamente lo que se publica.
#  - build: kaniko sin privilegios (sin docker.sock ni modo privileged)
#  - trivy: informe completo y puerta (falla con CVE HIGH o CRITICAL con arreglo disponible)
#  - publish: skopeo sube el tar al registro de Forgejo; solo desde main
# Dos variantes de la misma app para comparar CVE según la imagen base.

when:
  - event: push
    path:
      include:
        - services/images/homelab-check/**
        - .woodpecker/imagen-homelab-check.yml

matrix:
  include:
    - VARIANT: slim
      BASE: python:3.13-slim
    - VARIANT: alpine
      BASE: python:3.13-alpine

steps:
  - name: build
    image: gcr.io/kaniko-project/executor:v1.23.2-debug
    commands:
      - /kaniko/executor
        --context services/images/homelab-check
        --dockerfile services/images/homelab-check/Dockerfile
        --build-arg BASE=$BASE
        --destination homelab-check:$VARIANT
        --no-push
        --tar-path image.tar

  - name: trivy
    image: aquasec/trivy:0.58.1
    commands:
      - trivy image --input image.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0
      - trivy image --input image.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --quiet

  - name: publish
    image: quay.io/skopeo/stable:v1.16.1
    environment:
      FORGEJO_USER:
        from_secret: forgejo_registry_user
      FORGEJO_TOKEN:
        from_secret: forgejo_registry_token
    commands:
      # El host del registro sale de la URL de la forja (no se escribe aquí)
      - REGISTRY=$${CI_FORGE_URL#http://}
      - SHORT=$(echo $CI_COMMIT_SHA | cut -c1-8)
      # Dos etiquetas: la móvil (slim) y la inmutable por commit (slim-<sha>)
      - |
        for TAG in $VARIANT $VARIANT-$SHORT; do
          skopeo copy --dest-tls-verify=false \
            --dest-creds "$FORGEJO_USER:$FORGEJO_TOKEN" \
            docker-archive:image.tar docker://$REGISTRY/root/homelab-check:$TAG
        done
    when:
      - branch: main
