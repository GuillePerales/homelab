# Pipeline de OpenTofu: fmt -> validate -> plan en pull requests que tocan
# infrastructure/opentofu/**. Es el único que necesita red interna (el plan habla
# con la API de Proxmox), por eso sigue en Woodpecker, que corre dentro del
# homelab. El lint y el sops-check del repo viven en GitHub Actions.
# Woodpecker escucha al espejo de Forgejo, que replica ramas pero no pull requests:
# por eso el evento es push (el plan corre al sincronizar cada rama). El espejo no
# informa de los ficheros cambiados, así que el filtro de rutas puede no aplicarse y el
# pipeline correr en todas las ramas: es inocuo, el token del CI solo lee.
# Secretos: proxmox_token_id y proxmox_token_secret (token plan, PVEAuditor) y
# tofu_state_passphrase (descifra el estado del repo, encryption.tf).
when:
  event: push
  path: infrastructure/opentofu/**

steps:
  - name: tofu-fmt
    image: ghcr.io/opentofu/opentofu:1.13.2
    commands:
      - cd infrastructure/opentofu/proxmox
      - tofu fmt -check -recursive

  - name: tofu-validate
    image: ghcr.io/opentofu/opentofu:1.13.2
    environment:
      # La encryption se evalúa al iniciar: sin la frase, init y validate fallan
      TF_VAR_state_passphrase:
        from_secret: tofu_state_passphrase
    commands:
      - cd infrastructure/opentofu/proxmox
      - tofu init -backend=false
      - tofu validate

  - name: tofu-plan
    image: ghcr.io/opentofu/opentofu:1.13.2
    environment:
      PROXMOX_VE_ENDPOINT: https://10.0.5.12:8006
      PROXMOX_VE_INSECURE: "true"
      # OpenTofu solo lee variables del entorno con el prefijo TF_VAR_ (variables del README)
      TF_VAR_proxmox_api_token_id:
        from_secret: proxmox_token_id
      TF_VAR_proxmox_api_token_secret:
        from_secret: proxmox_token_secret
      TF_VAR_state_passphrase:
        from_secret: tofu_state_passphrase
    commands:
      - cd infrastructure/opentofu/proxmox
      - tofu init
      - tofu plan -no-color -out=tfplan
      - tofu show -no-color tfplan
