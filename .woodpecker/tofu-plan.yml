# Pipeline de OpenTofu: fmt -> validate -> plan en pull requests que tocan
# infrastructure/opentofu/**. Es el único que necesita red interna (el plan habla
# con la API de Proxmox), por eso sigue en Woodpecker, que corre dentro del
# homelab. El lint y el sops-check del repo viven en GitHub Actions.
# Nota: hoy infrastructure/opentofu/proxmox no tiene código .tf, así que no se
# ejecuta hasta que exista. Woodpecker escucha al espejo de Forgejo.

when:
  event: pull_request
  path:
    include: ["infrastructure/opentofu/**"]

steps:
  - name: tofu-fmt
    image: ghcr.io/opentofu/opentofu:1.13.2
    commands:
      - cd infrastructure/opentofu/proxmox
      - tofu fmt -check -recursive

  - name: tofu-validate
    image: ghcr.io/opentofu/opentofu:1.13.2
    commands:
      - cd infrastructure/opentofu/proxmox
      - tofu init -backend=false
      - tofu validate

  - name: tofu-plan
    image: ghcr.io/opentofu/opentofu:1.13.2
    environment:
      - PROXMOX_VE_ENDPOINT=https://10.0.5.12:8006
      - PROXMOX_VE_INSECURE=true
    secrets:
      - proxmox_token_id
      - proxmox_token_secret
    commands:
      - cd infrastructure/opentofu/proxmox
      - tofu init
      - tofu plan -no-color -out=tfplan
      - tofu show -no-color tfplan
    when:
      event: pull_request
