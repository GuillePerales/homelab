# Lint en Woodpecker sobre el espejo de Forgejo (root/homelab). El lint oficial
# que protege main vive en GitHub Actions (.github/workflows/); este pipeline
# lo duplica a propósito para comprobar el circuito GitHub -> espejo ->
# Woodpecker. Si el espejo no dispara pipelines o no aporta nada, eliminarlo.
#
# Qué hace: yamllint -> docker compose config de cada compose -> ansible-lint.

when:
  event: [push, pull_request]

steps:
  - name: yamllint
    image: pipelinecomponents/yamllint:0.35.27
    commands:
      - yamllint -d relaxed services/docker-compose/ infrastructure/ansible/ .woodpecker/

  - name: compose-validate
    image: docker:29.9.2-cli
    # docker compose config no necesita el daemon: sin docker.sock
    commands:
      - |
        find services/docker-compose -name "docker-compose.yml" | while read f; do
          echo "Validating $f..."
          docker compose -f "$f" config --quiet || exit 1
        done

  - name: ansible-lint
    image: pipelinecomponents/ansible-lint:0.79.54
    commands:
      - ansible-lint infrastructure/ansible/
    when:
      - path:
          include: ["infrastructure/ansible/**"]
