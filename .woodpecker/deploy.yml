# Pipeline de despliegue: al entrar un push en main que toque
# services/docker-compose/**, dispara el webhook de Portainer del stack afectado.
# Se conserva en Woodpecker porque el webhook solo es alcanzable desde la red
# interna. El lint y el sops-check del repo viven en GitHub Actions (no se repiten
# aquí: este pipeline solo corre tras fusionar a main).
#
# ATENCIÓN, pendiente de decisión: hoy no está claro que funcione. Los stacks
# "core" y "media" no existen como tales en Portainer y sus webhooks tampoco
# (ver el informe de la rama chore/ci-github-actions). Mientras falten los
# secretos portainer_webhook_*, el paso solo avisa y no falla.

when:
  event: push
  branch: main
  path:
    include: ["services/docker-compose/**"]

steps:
  - name: portainer-deploy
    image: curlimages/curl:8.23.0
    secrets:
      - portainer_webhook_core
      - portainer_webhook_media
    commands:
      # CI_PIPELINE_FILES (JSON, sin definir si el push toca más de 500 ficheros)
      # sustituye a CI_COMMIT_CHANGED_FILES, que ya no está documentada. Se lee
      # como variable de entorno del paso, sin ${...} en el YAML: el JSON con
      # comillas rompería el parseo.
      - |
        echo "Ficheros cambiados: $CI_PIPELINE_FILES"
        if [ -z "$CI_PIPELINE_FILES" ] || [ "$CI_PIPELINE_FILES" = "[]" ]; then
          echo "Sin lista de ficheros (más de 500 o evento sin ella): no se dispara nada"
          exit 0
        fi
        trigger() {
          # $1 = stack, $2 = URL del webhook (secreto)
          if ! echo "$CI_PIPELINE_FILES" | grep -q "services/docker-compose/$1/"; then
            return 0
          fi
          if [ -z "$2" ]; then
            echo "Cambió $1 pero no hay webhook configurado: se omite"
            return 0
          fi
          curl -X POST "$2" --silent --show-error --fail
          echo "Despliegue del stack $1 disparado"
        }
        trigger core "$PORTAINER_WEBHOOK_CORE"
        trigger media "$PORTAINER_WEBHOOK_MEDIA"
