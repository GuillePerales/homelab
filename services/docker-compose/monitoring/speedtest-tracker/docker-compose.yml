---
# Speedtest Tracker — velocidad de la línea a Internet con tests programados, en docker-main
# Proyecto de compose "speedtest-tracker" (enlace desde /opt/appdata/speedtest-tracker/compose).
# Sale por la línea normal (no por la VPN): mide lo que tiene la casa. El test de Ookla usa TCP 8080
# hacia sus servidores, que OPNsense tiene que permitir para esta IP.
# Homarr lo lee con la integración de Speedtest Tracker (API token creado en su web).
# .env (secretos en sops.env): CONTAINER_IP, TZ, APPDATA (/opt/appdata/speedtest-tracker),
# APP_KEY (clave de Laravel: base64 de 32 bytes aleatorios)
networks:
  srv-net:
    external: true
services:
  speedtest-tracker:
    container_name: speedtest-tracker
    image: lscr.io/linuxserver/speedtest-tracker:1.15.1
    restart: unless-stopped
    networks:
      srv-net:
        ipv4_address: ${CONTAINER_IP}
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - APP_KEY=${APP_KEY}
      - APP_URL=http://${CONTAINER_IP}
      - APP_TIMEZONE=${TZ}
      - DISPLAY_TIMEZONE=${TZ}
      - DB_CONNECTION=sqlite
      - SPEEDTEST_SCHEDULE=0 */6 * * *   # cada 6 h: ~4 tests al día
      - PRUNE_RESULTS_OLDER_THAN=180     # días de historial
    volumes:
      - ${APPDATA}/config:/config
