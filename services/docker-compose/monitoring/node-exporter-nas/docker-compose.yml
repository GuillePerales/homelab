---
# node_exporter del NAS (TrueNAS es un appliance: sin apt ni systemd propio, así que va en contenedor).
# Modo host y pid del host, con la raíz montada en solo lectura: así ve el sistema real (CPU, RAM,
# red, discos, ZFS) y no el del contenedor. Escucha solo en la IP del NAS en INFRA, no en todas sus
# interfaces; quién llega al 9100 lo decide una regla de OPNsense (solo Prometheus).
# Se despliega a mano en el NAS, como smartctl-exporter: copia o enlace de este compose y un .env.
services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.13.1
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --web.listen-address=${LISTEN_ADDRESS}
    network_mode: host
    pid: host
    environment:
      - TZ=${TZ}
    volumes:
      - /:/host:ro,rslave
