# homelab/services/docker-compose/storage/immich/docker-compose.yml
# Immich - Google Photos self-hosted alternative
# Host: nas-01 (docker-nas) | IP: XX.XX | Port: 2283
# Docs: https://immich.app/docs/install/docker-compose

networks:
  srv-net:
    external: true
  immich-net:
    driver: bridge

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.3.5}
    container_name: immich-server
    restart: unless-stopped
    networks:
      srv-net:
        ipv4_address: ${CONTAINER_IP}
      immich-net:
    depends_on:
      immich-postgres:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}
      - REDIS_HOSTNAME=immich-redis
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3.3.5}
    container_name: immich-machine-learning
    restart: unless-stopped
    networks:
      - immich-net
    environment:
      - TZ=${TZ}
    volumes:
      - ${ML_CACHE}:/cache

  immich-redis:
    # Valkey y Postgres: imágenes y digest del compose oficial de la versión de Immich.
    # Se actualizan con sus notas de versión, no con diun.
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    container_name: immich-redis
    labels:
      - "diun.enable=false"
    restart: unless-stopped
    networks:
      - immich-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  immich-postgres:
    # VectorChord (v3 ya no admite pgvecto.rs); incluye pgvecto.rs para migrar desde él
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-postgres
    restart: unless-stopped
    labels:
      - "diun.enable=false"
    networks:
      - immich-net
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_DB=${DB_DATABASE_NAME}
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - ${DB_DATA}:/var/lib/postgresql/data
    shm_size: 128mb
