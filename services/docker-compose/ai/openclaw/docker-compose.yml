---
# OpenClaw — Agente IA para gestión del homelab
# Desplegado en pve-router (LXC), VLAN 15 (AI) — firewall estricto
# Reglas de firewall en la documentación privada del homelab (no en este repo)

services:
  openclaw:
    image: openclaw/openclaw:2026.10.6
    container_name: openclaw
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PROXMOX_HOST=${PROXMOX_HOST}
      - PROXMOX_TOKEN_ID=${PROXMOX_TOKEN_ID}
      - PROXMOX_TOKEN_SECRET=${PROXMOX_TOKEN_SECRET}
      - OPNSENSE_HOST=${OPNSENSE_HOST}
      - OPNSENSE_KEY=${OPNSENSE_KEY}
      - OPNSENSE_SECRET=${OPNSENSE_SECRET}
      - TRUENAS_HOST=${TRUENAS_HOST}
      - TRUENAS_API_KEY=${TRUENAS_API_KEY}
      - PORTAINER_HOST=${PORTAINER_HOST}
      - PORTAINER_TOKEN=${PORTAINER_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ${APPDATA}:/config
    networks:
      ai-net:
        ipv4_address: ${CONTAINER_IP}

networks:
  ai-net:
    external: true
    name: ai-net
