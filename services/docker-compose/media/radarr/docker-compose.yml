# homelab/services/docker-compose/media/radarr/docker-compose.yml
networks:
  srv-net:
    external: true

services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    container_name: radarr
    restart: unless-stopped
    networks:
      srv-net:
        ipv4_address: ${CONTAINER_IP}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA}:/config
      # Un único montaje con descargas y biblioteca: las importaciones son hardlinks (guía TRaSH)
      - ${DATA}:/data
