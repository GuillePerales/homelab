---
# Seerr — watchlist y peticiones a Radarr/Sonarr, con login de Jellyfin
# Sucesor de Overseerr y Jellyseerr. Corre como el usuario node (UID 1000): la appdata debe ser 1000:1000.
networks:
  srv-net:
    external: true
services:
  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:v3.5.1
    init: true
    restart: unless-stopped
    networks:
      srv-net:
        ipv4_address: ${CONTAINER_IP}
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
    volumes:
      - ${APPDATA}/config:/app/config
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 60s
      retries: 3
