# homelab/services/docker-compose/media/jdownloader/docker-compose.yml
networks:
  srv-net:
    external: true

services:
  jdownloader:
    image: jlesage/jdownloader-2:v26.03.1
    container_name: jdownloader
    restart: unless-stopped
    networks:
      srv-net:
        ipv4_address: ${CONTAINER_IP}
    # Sale a internet solo por ProtonVPN (alias VPN_HOSTS en OPNsense): DNS de Proton por el túnel
    dns:
      - ${VPN_DNS}
    environment:
      - USER_ID=${PUID}
      - GROUP_ID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA}:/config
      - ${DOWNLOADS}:/output
