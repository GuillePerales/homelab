# homelab/services/docker-compose/media/lidarr/docker-compose.yml
networks:
  srv-net:
    external: true

services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:3.1.6
    container_name: lidarr
    labels:
      # 8.1.x son tags antiguos (rama nightly previa)
      - "diun.exclude_tags=^8\\.1\\."
    restart: unless-stopped
    networks:
      srv-net:
        ipv4_address: ${CONTAINER_IP}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA}:/config
      # Un único montaje con descargas y biblioteca: las importaciones son hardlinks (guía TRaSH)
      - ${DATA}:/data
