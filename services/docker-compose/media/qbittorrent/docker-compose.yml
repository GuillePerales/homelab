# homelab/services/docker-compose/media/qbittorrent/docker-compose.yml
networks:
  srv-net:
    external: true

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0
    container_name: qbittorrent
    labels:
      # 14.x son tags antiguos del esquema de versiones anterior
      - "diun.exclude_tags=^14\\."
    restart: unless-stopped
    networks:
      srv-net:
        ipv4_address: ${CONTAINER_IP}
    # Sale a internet solo por ProtonVPN (alias VPN_HOSTS en OPNsense): DNS de Proton por el túnel
    dns:
      - ${VPN_DNS}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${WEBUI_PORT}
    volumes:
      - ${APPDATA}:/config
      # Solo su carpeta dentro de /data, con la misma ruta que ven las *arr (guía TRaSH)
      - ${DATA}/torrents:/data/torrents
