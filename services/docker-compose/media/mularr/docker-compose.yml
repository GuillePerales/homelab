# homelab/services/docker-compose/media/mularr/docker-compose.yml
# Mularr — aMule (red eD2k/Kad) con interfaz web y API compatible con qBittorrent y Torznab para Sonarr/Radarr.
# Detrás de su propio Gluetun (ProtonVPN reenvía un solo puerto por conexión): Mularr lee el puerto
# de la API de Gluetun y se lo pone a aMule, que así tiene HighID.
networks:
  srv-net:
    external: true

configs:
  # Rutas de solo lectura de la API de Gluetun que usa Mularr, sin autenticación: la API (puerto 8000)
  # no está abierta en el cortafuegos de Gluetun, así que solo se llega desde el propio contenedor
  gluetun-auth:
    content: |
      [[roles]]
      name = "mularr"
      routes = ["GET /v1/publicip/ip", "GET /v1/vpn/status", "GET /v1/portforward"]
      auth = "none"

services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun-mularr
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      srv-net:
        ipv4_address: ${CONTAINER_IP}
    configs:
      - source: gluetun-auth
        target: /gluetun/auth/config.toml
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${VPN_COUNTRIES}
      # Solo servidores P2P con reenvío de puerto
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      # Web de Mularr accesible desde la red local; el resto de entradas, cerradas
      - FIREWALL_INPUT_PORTS=8940
      # Mularr consulta Radarr y Sonarr en la red local
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNETS}

  mularr:
    image: ghcr.io/joecarl/mularr:v1.0.0
    container_name: mularr
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
      - UMASK=002
      - AMULE_INCOMING_DIR=/data/emule
      - AMULE_TEMP_DIR=/data/emule/.incomplete
      # Lee el puerto reenviado de Gluetun y lo pone en aMule (HighID)
      - GLUETUN_ENABLED=true
      - GLUETUN_API=http://localhost:8000/v1
      - AUTH_USERNAME=${AUTH_USERNAME}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
      - API_KEY=${API_KEY}
    volumes:
      - ${APPDATA}:/app/data
      # Solo su carpeta dentro de /data, con la misma ruta que ven las *arr (guía TRaSH)
      - ${DATA}/emule:/data/emule
