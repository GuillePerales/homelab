# homelab/services/docker-compose/media/jellyfin/docker-compose.yml
# Jellyfin - servidor multimedia self-hosted
# Host: docker-main (pve-main) | IP: 10.0.30.30 | Port: 8096

networks:
  srv-net:
    external: true

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    networks:
      srv-net:
        ipv4_address: ${CONTAINER_IP}
    environment:
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=http://${CONTAINER_IP}
    volumes:
      - ${APPDATA}:/config
      - ${MEDIA}/movies:/data/movies:ro
      - ${MEDIA}/tv:/data/tv:ro
      - ${MEDIA}/music:/data/music:ro
