# cert-manager: el chart de Jetstack con los valores de este repo, más los
# ClusterIssuer de services/k8s/apps/cert-manager.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.3
      helm:
        valueFiles:
          - $values/infrastructure/helm/cert-manager/values.yaml
    - repoURL: http://10.0.30.28:3000/root/homelab.git
      targetRevision: main
      ref: values
    - repoURL: http://10.0.30.28:3000/root/homelab.git
      targetRevision: main
      path: services/k8s/apps/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true # los ClusterIssuer llegan antes que sus CRD
