# homelab-check en K3s: la misma imagen que corre en Docker, desplegada por ArgoCD.
# Los secretos no están en el repo (es público); se crean en el clúster:
#   homelab-check-env  -> CHECK_URLS, NTFY_URL, INTERVAL, TZ (de su .env)
#   forgejo-registry   -> credencial de lectura del registro de Forgejo
# Para subir de versión se cambia la etiqueta de la imagen aquí y ArgoCD hace el resto.
---
apiVersion: v1
kind: Namespace
metadata:
  name: homelab-check
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-check
  namespace: homelab-check
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homelab-check
  template:
    metadata:
      labels:
        app: homelab-check
    spec:
      imagePullSecrets:
        - name: forgejo-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homelab-check
          image: 10.0.30.28:3000/root/homelab-check:slim-92977beb
          envFrom:
            - secretRef:
                name: homelab-check-env
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              memory: 16Mi
              cpu: 5m
            limits:
              memory: 64Mi
