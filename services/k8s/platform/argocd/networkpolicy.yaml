# Solo entra tráfico de pods del mismo namespace; lo demás, con permisos explícitos abajo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solo-mismo-namespace
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# Traefik (kube-system) publica la UI y la API de ArgoCD.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: desde-traefik
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 8080
