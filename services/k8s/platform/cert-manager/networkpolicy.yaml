# Solo entra tráfico de pods del mismo namespace; lo demás, con permisos explícitos abajo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solo-mismo-namespace
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# El webhook de cert-manager lo llama el API server (origen: el nodo).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webhook-desde-el-api-server
  namespace: cert-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: webhook
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.42.0.1/32 # gateway de los pods en el nodo (cni0)
        - ipBlock:
            cidr: 10.0.30.70/32 # IP del nodo
      ports:
        - port: 10250
