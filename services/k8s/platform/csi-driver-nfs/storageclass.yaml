# StorageClass de volúmenes en el NAS (dataset tank/k8s, cuota de 50 GB).
# Una subcarpeta por volumen. No es la de por defecto: local-path sigue siéndolo.
# Para lo que no debe ir por NFS (Vault, la base de K3s) se usa local-path.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-nas
provisioner: nfs.csi.k8s.io
parameters:
  server: 10.0.5.10
  share: /mnt/tank/k8s
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: false
mountOptions:
  - nfsvers=4.1
  - hard
