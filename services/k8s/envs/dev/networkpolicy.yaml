# Solo entra tráfico de pods del mismo namespace: dev y prod no se ven entre sí ni
# reciben tráfico de otros namespaces. La salida queda abierta (DNS, Vault, registro, ntfy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solo-mismo-namespace
  namespace: dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
